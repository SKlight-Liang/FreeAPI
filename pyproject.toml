[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "FreeAPI"
version         = "0.2.0"
description     = "Bridge the gap between web-based AI and local applications"

requires-python = ">=3.12"
dependencies    = [
    "aiohttp>=3.14",
    "wasmtime>=49.0",
    "playwright>=1.63",
    "json-repair>=0.63",
    "platformdirs>=4.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1"
]

[project.scripts]
FreeAPI-Auth  = "FreeAPISrc.DeepSeekAuth:main"
FreeAPI-ChatB = "FreeAPISrc.ChatBrowser:main"
FreeAPI-Chat  = "FreeAPISrc.ChatTerminal:main"

[tool.setuptools.packages.find]
where      = ["."]
include    = ["FreeAPISrc", "FreeAPISrc.*"]
namespaces = false

[tool.setuptools.package-data]
FreeAPISrc = ["resources/*.wasm"]
